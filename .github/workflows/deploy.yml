name: Deploy to adva.media/vlasta

# Rebuilds every page from content/ and rsyncs the result to the server.
# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site from content/
        run: node tools/build.mjs

      - name: Check links and assets
        run: node tools/check.mjs

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${{ secrets.SSH_PORT }}"
          ssh-keyscan -p "${PORT:-22}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          PORT="${{ secrets.SSH_PORT }}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT:-22}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.claude' \
            --exclude='_boss-preview' \
            --exclude='vendor' \
            --exclude='content' \
            --exclude='tools' \
            --exclude='assets/live-scrape' \
            --exclude='*.bak' \
            --exclude='*.md' \
            --exclude='server.js' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Summary
        run: |
          echo "### Deployed to adva.media/vlasta" >> $GITHUB_STEP_SUMMARY
          echo "Pages rebuilt from \`content/\` and synced to \`${{ secrets.DEPLOY_PATH }}\`." >> $GITHUB_STEP_SUMMARY
